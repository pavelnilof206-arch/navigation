<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Навигация ЕГЭ Биология</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #f4f7f4;
      --card-bg: #ffffff;
      --text-main: #1e2a1e;
      --text-muted: #7a8f7a;
      --green-dark: #2f5d3f;
      --green-light: #e8f1e8;
      --border-color: #e3ebe3;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px 16px 40px;
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }
    
    .page { display: none; }
    .page.active { display: block; animation: fadeIn 0.25s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    /* Заголовки */
    .header { text-align: center; margin-bottom: 24px; padding-top: 10px; }
    .header h1 { font-size: 26px; font-weight: 800; color: var(--green-dark); letter-spacing: -0.5px; }
    .header .subtitle { font-size: 13px; color: var(--text-muted); margin-top: 4px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; }

    .page-title { text-align: center; font-size: 20px; font-weight: 700; color: var(--green-dark); margin-bottom: 24px; }

    /* Карточки главного меню */
    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 12px;
      box-shadow: 0 4px 15px rgba(47, 93, 63, 0.05);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border: 1px solid var(--border-color);
    }
    .card:active { transform: scale(0.97); background: var(--green-light); }
    .card-text { font-size: 16px; font-weight: 600; color: var(--green-dark); }

    /* Некликабельные заголовки разделов */
    .section-header {
      font-size: 13px;
      font-weight: 700;
      color: var(--green-dark);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 28px 0 12px 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-header::after {
      content: "";
      flex-grow: 1;
      height: 2px;
      background: var(--green-light);
      border-radius: 2px;
    }
    .section-header:first-of-type { margin-top: 0; }

    /* Карточки тем */
    .topic-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px 18px;
      margin-bottom: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      cursor: pointer;
      transition: all 0.15s ease;
      border: 1px solid transparent;
    }
    .topic-card:active { transform: scale(0.98); background: var(--green-light); border-color: var(--green-light); }
    .topic-title { font-size: 15px; font-weight: 500; color: var(--text-main); line-height: 1.4; }

    /* Стили для заблокированных (серых) кнопок */
    .disabled {
      background: #e2e6e2;
      cursor: not-allowed;
      pointer-events: none;
      box-shadow: none;
      border: 1px solid #d1d8d1;
    }
    .disabled .card-text, .disabled .topic-title {
      color: #8d998d;
    }
    
    /* Кнопка назад */
    .back-btn {
      display: inline-flex;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      color: var(--green-dark);
      font-size: 14px;
      font-weight: 600;
      padding: 10px 16px;
      margin-bottom: 20px;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.02);
      transition: background 0.15s;
    }
    .back-btn:active { background: var(--green-light); }

    /* Сетка для цифр (Практика) */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-top: 10px;
    }
    .grid-item {
      background: var(--card-bg);
      border-radius: 12px;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 600;
      color: var(--green-dark);
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      cursor: pointer;
      transition: all 0.15s ease;
      border: 1px solid var(--border-color);
    }
    .grid-item:active {
      transform: scale(0.9);
      background: var(--green-light);
    }
  </style>
</head>
<body>

<!-- ========== ГЛАВНАЯ ========== -->
<div id="page-home" class="page active">
  <div class="header">
    <h1>Навигация</h1>
    <div class="subtitle">ЕГЭ Биология 2027</div>
  </div>

  <div class="card" onclick="goTo('page-codifier')">
    <span class="card-text">📖 Теория по темам</span>
  </div>
  <div class="card" onclick="goTo('page-tasks-theory')">
    <span class="card-text">📝 Теория по заданиям</span>
  </div>
  <div class="card" onclick="goTo('page-topics-practice')">
    <span class="card-text">🧪 Практика по темам</span>
  </div>
  <div class="card" onclick="goTo('page-tasks-practice')">
    <span class="card-text">🧩 Практика по заданиям</span>
  </div>
  <div class="card" onclick="goTo('page-variants-years')">
    <span class="card-text">📋 Пробные варианты</span>
  </div>
</div>

<!-- ========== ТЕОРИЯ ПО ТЕМАМ ========== -->
<div id="page-codifier" class="page">
  <button class="back-btn" onclick="goTo('page-home')">‹ Назад</button>
  <div class="page-title">Теория по темам</div>
  <div id="codifier-content"></div>
</div>

<!-- ========== ТЕОРИЯ ПО ЗАДАНИЯМ ========== -->
<div id="page-tasks-theory" class="page">
  <button class="back-btn" onclick="goTo('page-home')">‹ Назад</button>
  <div class="page-title">Теория по заданиям</div>
  <div id="tasks-theory-content"></div>
</div>

<!-- ========== ПРАКТИКА ПО ТЕМАМ ========== -->
<div id="page-topics-practice" class="page">
  <button class="back-btn" onclick="goTo('page-home')">‹ Назад</button>
  <div class="page-title">Практика по темам</div>
  <div id="topics-practice-content"></div>
</div>

<!-- ========== ПРАКТИКА ПО ЗАДАНИЯМ ========== -->
<div id="page-tasks-practice" class="page">
  <button class="back-btn" onclick="goTo('page-home')">‹ Назад</button>
  <div class="page-title">Практика по заданиям</div>
  <div id="tasks-practice-content"></div>
</div>

<!-- ========== ЭКРАН С СЕТКОЙ ЗАДАЧ ========== -->
<div id="page-practice-grid" class="page">
  <button class="back-btn" onclick="goBackFromGrid()">‹ Назад</button>
  <div class="page-title" id="grid-title">Задачи</div>
  <div class="grid-container" id="grid-content"></div>
</div>

<!-- ========== ВАРИАНТЫ: ВЫБОР ГОДА ========== -->
<div id="page-variants-years" class="page">
  <button class="back-btn" onclick="goTo('page-home')">‹ Назад</button>
  <div class="page-title">Пробные варианты</div>
  
  <div class="card" onclick="showVariants()">
    <span class="card-text">2026-2027 год</span>
  </div>
  <div class="card disabled">
    <span class="card-text">2027-2028 год</span>
  </div>
</div>

<!-- ========== ВАРИАНТЫ: СПИСОК НОМЕРОВ ========== -->
<div id="page-variants-list" class="page">
  <button class="back-btn" onclick="goTo('page-variants-years')">‹ Назад</button>
  <div class="page-title">2026-2027 год</div>
  <div id="variants-list-content"></div>
</div>

<script>
  // Переменная для хранения того, откуда мы пришли в сетку
  let currentPracticeType = 'topics'; 

  function goTo(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
    window.scrollTo(0, 0);
  }

  function openPost(url) {
    if (url === '#') {
      alert('Ссылка на этот материал еще не добавлена');
      return;
    }
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.openTelegramLink(url);
    } else {
      window.open(url, '_blank');
    }
  }

  function renderSections(containerId, sections, isPractice) {
    const el = document.getElementById(containerId);
    let html = '';
    sections.forEach(sec => {
      html += `<div class="section-header">${sec.section}</div>`;
      sec.topics.forEach((t) => {
        if (isPractice) {
          // Передаем только строку (название темы), тип контейнера определяем отдельно
          html += `<div class="topic-card" onclick="openPracticeGrid(this.innerText, 'topics')"><div class="topic-title">${t.title}</div></div>`;
        } else {
          html += `<div class="topic-card" onclick="openPost('${t.url}')"><div class="topic-title">${t.title}</div></div>`;
        }
      });
    });
    el.innerHTML = html;
  }

  function renderSimple(containerId, items, isPractice) {
    const el = document.getElementById(containerId);
    el.innerHTML = items.map(item => {
      if (isPractice) {
        return `
          <div class="topic-card" onclick="openPracticeGrid(this.innerText, 'tasks')">
            <div class="topic-title">${item.title}</div>
          </div>`;
      } else {
        return `
          <div class="topic-card" onclick="openPost('${item.url}')">
            <div class="topic-title">${item.title}</div>
          </div>`;
      }
    }).join('');
  }

  // Функция открытия сетки задач
  function openPracticeGrid(title, type) {
    currentPracticeType = type; // 'topics' или 'tasks'
    document.getElementById('grid-title').textContent = title;
    
    const gridEl = document.getElementById('grid-content');
    let html = '';
    for (let i = 1; i <= 15; i++) {
      html += `<div class="grid-item" onclick="openPost('#')">${i}</div>`;
    }
    gridEl.innerHTML = html;
    
    goTo('page-practice-grid');
  }

  // Функция возврата из сетки
  function goBackFromGrid() {
    if (currentPracticeType === 'topics') {
      goTo('page-topics-practice');
      renderSections('topics-practice-content', TOPICS_PRACTICE, true); // Перерисовываем
    } else {
      goTo('page-tasks-practice');
      renderSimple('tasks-practice-content', TASKS_PRACTICE, true); // Перерисовываем
    }
  }

  // Логика для вариантов
  function showVariants() {
    const container = document.getElementById('variants-list-content');
    let html = '';
    
    for (let i = 1; i <= 4; i++) {
      html += `<div class="topic-card" onclick="openPost('#')"><div class="topic-title">Вариант ${i}</div></div>`;
    }
    for (let i = 5; i <= 10; i++) {
      html += `<div class="topic-card disabled"><div class="topic-title">Вариант ${i}</div></div>`;
    }
    
    container.innerHTML = html;
    goTo('page-variants-list');
  }

  // ============================================================
  // ДАННЫЕ
  // ============================================================

    {
      section: '5. Эволюция',

        { title: 'Теория эволюции. Развитие эволюционных идей', url: '#' },

      topics: [

  const TASKS_THEORY = [
    { title: 'Задание 1. Биология как наука', url: '#' },
    { title: 'Задание 2. Прогноз результатов эксперимента', url: '#' },

    { title: 'Задание 23. Выводы по результатам экспериментов', url: '#' },

  const TOPICS_PRACTICE = CODIFIER;

  // Инициализация
  renderSections('codifier-content', CODIFIER, false);
  renderSections('topics-practice-content', TOPICS_PRACTICE, true);
  renderSimple('tasks-theory-content', TASKS_THEORY, false);
  renderSimple('tasks-practice-content', TASKS_PRACTICE, true);

  if (window.Telegram && window.Telegram.WebApp) {
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
  }
</script>
</body>
</html>
