  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #f4f7f4;
      --card-bg: #ffffff;
      --text-main: #1e2a1e;
      --text-muted: #7a8f7a;
      --green-dark: #2f5d3f;
      --green-light: #e8f1e8;
      --border-color: #e3ebe3;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 20px 16px 40px;
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }
    
    .page { display: none; }
    .page.active { display: block; animation: fadeIn 0.25s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    /* Заголовки */
    .header { text-align: center; margin-bottom: 24px; padding-top: 10px; }
    .header h1 { font-size: 26px; font-weight: 800; color: var(--green-dark); letter-spacing: -0.5px; }
    .header .subtitle { font-size: 13px; color: var(--text-muted); margin-top: 4px; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; }

    .page-title { text-align: center; font-size: 20px; font-weight: 700; color: var(--green-dark); margin-bottom: 24px; }

    /* Карточки главного меню */
    .card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 12px;
      box-shadow: 0 4px 15px rgba(47, 93, 63, 0.05);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border: 1px solid var(--border-color);
    }
    .card:active { transform: scale(0.97); background: var(--green-light); }
    .card-icon { font-size: 22px; }
    .card-text { font-size: 16px; font-weight: 600; color: var(--green-dark); }

    /* Некликабельные заголовки разделов */
    .section-header {
      font-size: 13px;
      font-weight: 700;
      color: var(--green-dark);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 28px 0 12px 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-header::after {
      content: "";
      flex-grow: 1;
      height: 2px;
      background: var(--green-light);
      border-radius: 2px;
    }
    .section-header:first-of-type { margin-top: 0; }

    /* Карточки тем */
    .topic-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 16px 18px;
      margin-bottom: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      cursor: pointer;
      transition: all 0.15s ease;
      border: 1px solid transparent;
    }
    .topic-card:active { transform: scale(0.98); background: var(--green-light); border-color: var(--green-light); }
    .topic-title { font-size: 15px; font-weight: 500; color: var(--text-main); line-height: 1.4; }
    
    /* Кнопка назад */
    .back-btn {
      display: inline-flex;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      color: var(--green-dark);
      font-size: 14px;
      font-weight: 600;
      padding: 10px 16px;
      margin-bottom: 20px;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.02);
      transition: background 0.15s;
    }
    .back-btn:active { background: var(--green-light); }

  function goTo(pageId) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
    window.scrollTo(0, 0);
  }

  function openPost(url) {
    if (url === '#') {
      alert('Ссылка на этот конспект еще не добавлена');
      return;
    }
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.openTelegramLink(url);
    } else {
      window.open(url, '_blank');
    }
  }

  function renderSections(containerId, sections) {
    const el = document.getElementById(containerId);
    let html = '';
    sections.forEach(sec => {
      html += `<div class="section-header">${sec.section}</div>`;
      sec.topics.forEach(t => {
        html += `<div class="topic-card" onclick="openPost('${t.url}')"><div class="topic-title">${t.title}</div></div>`;
      });
    });
    el.innerHTML = html;
  }

  function renderSimple(containerId, items) {
    const el = document.getElementById(containerId);

      <div class="topic-card" onclick="openPost('${item.url}')">

      </div>
